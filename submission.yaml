submission:
  title: "ThreatIQ — Threat Intelligence Correlation & Alert Prioritisation Assistant"   # REQUIRED — Project display name

  problem_statement: >                         # REQUIRED — 1-3 sentences. What problem? Who has it?
    Defence analysts and security operations teams receive large volumes of alerts
    from multiple security and intelligence sources in different formats. Manually
    connecting related signals, separating meaningful threats from false positives,
    and producing decision-ready intelligence is time-consuming and can lead to
    analyst fatigue and delayed response to high-risk activity.

  solution_summary: >                          # REQUIRED — 1-3 sentences. What did you build?
    ThreatIQ is an AI-assisted threat intelligence command centre that ingests
    simulated multi-source security telemetry, normalises and correlates related
    alerts, prioritises threat clusters using explainable risk scoring, maps observed
    behaviour to MITRE ATT&CK techniques, and generates commander-ready BLUF
    investigation reports.

  key_features:                                # REQUIRED — List 3 to 5 specific features you implemented
    - "Multi-source security alert ingestion and normalisation across SIEM, network sensor, authentication, firewall, and threat-intelligence data"
    - "Cross-source alert correlation using malicious indicators, entities, and time-window relationships"
    - "Explainable risk scoring with source diversity, recency, severity, known-indicator, and false-positive signals"
    - "Automatic MITRE ATT&CK technique mapping with confidence and investigation context"
    - "Commander-ready BLUF report generation with supporting evidence, confidence, and recommended actions"

  tech_stack:
    languages: ["Python", "JavaScript"]        # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "Jinja2", "Tailwind CSS"]   # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob"]              # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []
    other: ["MITRE ATT&CK", "GitHub Actions"]

  what_we_are_most_proud_of: >                 # Optional but recommended
    The strongest part of ThreatIQ is the complete intelligence workflow from
    fragmented security alerts to a prioritised threat picture and commander-ready
    BLUF report. The prototype demonstrates a real processing chain — 13 simulated
    alerts are correlated into 3 investigation clusters, risk-scored, mapped to
    ATT&CK techniques, and transformed into evidence-backed intelligence for the
    highest-risk threat. The result is a decision-support workflow rather than
    simply a static security dashboard.

  known_limitations: >                         # Optional but recommended
    The current prototype uses simulated security telemetry rather than live
    operational or defence feeds. Correlation and risk scoring are implemented
    application-side, while MITRE ATT&CK mapping currently uses pattern-based
    mappings and should be reviewed for novel or highly obfuscated behaviour.
    Investigation status updates, analyst assignment, and notes are demonstrated
    as prototype interactions rather than persistent production workflows.
    Production authentication, authorisation, persistent storage, and live
    security-system integrations are outside the current prototype scope.

